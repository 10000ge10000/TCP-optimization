name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell and Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install POSIX test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes busybox shellcheck

      - name: Verify generated distribution
        run: sh scripts/check-generated.sh

      - name: Parse generated Shell script
        run: |
          bash -n tcp-tune.sh
          dash -n tcp-tune.sh
          busybox ash -n tcp-tune.sh
          shellcheck -s sh tcp-tune.sh

      - name: Run Shell unit tests
        run: sh tests/shell/run.sh

      - name: Run Agent integration tests
        run: sh tests/agent/run.sh

      - name: Run validation tool tests
        run: python3 -m unittest discover -s tests/validation -p 'test_*.py'

      - name: Distribution smoke test
        run: |
          sh tcp-tune.sh --help >/dev/null
          if sh tcp-tune.sh not-a-command >/dev/null 2>&1; then
            echo "unknown command must fail" >&2
            exit 1
          fi
          sudo sh tcp-tune.sh --dry-run --yes local-minimal --ipv6-peer 2001:db8::1
          sudo sh tcp-tune.sh --dry-run --yes vps-adapt --peer-ipv6 2001:db8::1 --profile cubic-safe
          sudo sh tcp-tune.sh --dry-run --yes listen

      - name: Check whitespace and generated tree
        run: |
          git diff --check
          git diff --exit-code

  powershell:
    name: PowerShell 5.1 and 7
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\build-powershell.ps1 -Check
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\tcp-tune.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\tcp-tune.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path .\src\windows -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

      - name: Install and run Pester with Windows PowerShell 5.1
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester -Path .\tests\powershell -CI

      - name: Install Pester for PowerShell 7
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester with PowerShell 7
        shell: pwsh
        run: Invoke-Pester -Path .\tests\powershell -CI

  macos:
    name: macOS shell compatibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Parse with macOS sh and verify BSD awk parser
        run: |
          sh -n tcp-tune.sh
          TCP_TUNE_LIBRARY=1 sh -c '
            . ./tcp-tune.sh
            have_cmd() { return 1; }
            first="$(extract_first_interval_bps < tests/fixtures/iperf3/iperf-3.17.1-ipv6-upload-p1.json)"
            [ "$first" = "248227048" ] || { echo "awk first=$first" >&2; exit 1; }
            bps="$(extract_bps < tests/fixtures/iperf3/iperf-3.17.1-ipv6-upload-p1.json)"
            [ "$bps" = "64288432" ] || { echo "awk bps=$bps" >&2; exit 1; }
          '
